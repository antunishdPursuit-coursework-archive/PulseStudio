name: pages

# Browsers cannot run TypeScript and GitHub Pages does not build, so the
# site is compiled here. The gate always runs — a red gate never ships.
#
# TWO JOBS, AND THE SPLIT IS THE POINT. Until 2026-08-22 the gate and the
# deploy were one job, and that job declared `environment: github-pages`.
# The environment only permits `main` to deploy, and an environment rule is
# checked when the JOB STARTS — so running this workflow on any other
# branch was refused before a single check had run. There was no way to
# find out whether a branch was green except to merge it to main and watch
# the live site. The gate has no business needing deploy permission, so it
# no longer claims the environment: it runs anywhere, on a branch, on a
# pull request, on a dispatch. Only `deploy` claims github-pages, and only
# main can reach it.
#
# The DEPLOY leg additionally runs only when this repo's Pages is set to
# deploy from Actions (Settings -> Pages -> Source: GitHub Actions);
# otherwise the run states the skip and stays green, because "this repo has
# not enabled Actions deploys" is an environment fact, not a build failure.
# The workflow token cannot flip that switch itself — only a repo admin can.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by ref, NOT a single "pages" group. One shared group meant a pull
# request run could cancel a deploy of main that was already in flight,
# now that pull requests reach this workflow at all.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pagesmode.outputs.mode }}
      publishing: ${{ steps.publishing.outputs.ok }}
    steps:
        # FULL HISTORY, ON PURPOSE. check-lanes.mjs and check-language.mjs
        # read the commits this branch adds on top of origin/main. The
        # default depth-1 checkout has no origin/main to compare against, so
        # both said so and stood down — honestly, but uselessly: the lane
        # law is the one rule that keeps two people's branches from
        # colliding, and it was skipping on every pull request, which is the
        # only place it can still prevent anything. The repo is 147 tracked
        # files; the full fetch costs nothing worth measuring.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # The gate runs before anything is published — a red gate never deploys.
      - run: npm run check
      - run: npm run build

      - name: Would this run publish?
        id: publishing
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ok=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Gate green — nothing published"
              echo "This run is on \`${{ github.ref }}\`, and only \`main\` publishes."
              echo "That is the whole point of running it here: a branch can be proven green before it is merged."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Is this repo set to deploy Pages from Actions?
        id: pagesmode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A FAILED CALL IS NOT AN ANSWER. This was one line with
          # `|| echo "none"` on the end, which folded three different
          # outcomes into one: Pages is not enabled, the token was refused,
          # and the API was briefly unreachable. The last two would have
          # skipped the publish, left the run GREEN, and reported success
          # for a deploy that never happened. A 404 is a fact about this
          # repo and stays green; anything else stops the run.
          set +e
          mode=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/tmp/pages-api-err)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -q "HTTP 404" /tmp/pages-api-err; then
              mode="none"
            else
              echo "::error::Could not read this repo's Pages configuration, so this run cannot tell whether it should publish. Refusing to guess."
              cat /tmp/pages-api-err
              exit 1
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" != "workflow" ]; then
            {
              echo "### Build green — deploy skipped"
              echo "Pages source on this repo is \`$mode\`, not GitHub Actions."
              echo "A repo admin can enable deploys: Settings -> Pages -> Source: GitHub Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.publishing.outputs.ok == 'yes' && steps.pagesmode.outputs.mode == 'workflow'
        uses: actions/configure-pages@v5
      - if: steps.publishing.outputs.ok == 'yes' && steps.pagesmode.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: gate
    if: needs.gate.outputs.publishing == 'yes' && needs.gate.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
