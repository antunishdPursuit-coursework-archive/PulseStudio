<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <title>Unit checks — shared session contract</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../theme.css">
  <style>
    .pass { color: var(--muted); margin: 2px 0; }
    .fail { color: var(--fg); font-weight: 700; margin: 2px 0; }
    #summary { font-weight: 700; }
  </style>
</head>
<body data-no-session>
  <header class="page-head">
    <a class="back" href="../../index.html">← Pulse Studio</a>
    <h1>Shared session contract — unit checks</h1>
  </header>
  <main>
    <p id="summary" class="status" aria-live="polite">Running the checks…</p>
    <section id="results" aria-label="Check results"></section>
  </main>
  <!-- The appearance choice follows a person onto every page in the studio,
       and this was the one page it did not: it opted out of the session chip
       (right — this page writes and clears sessions for a living) but never
       loaded theme-boot at all, so light, dark and a custom pair simply did
       not apply here. data-no-session above still keeps the chip off; the
       other two proof pages have always done exactly this pair. -->
  <script type="module" src="../theme-boot.js"></script>
  <script type="module" src="./tests.js"></script>
</body>
</html>
