<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Pulse Studio">
  <!-- THE SOURCE for og-image.png, kept beside it so the raster is never the
       only copy. The mark is app/favicon.svg's path — the SAME d attribute as
       PULSE_MARK_PATH in shared/components/logo.ts — scaled by a transform
       rather than retyped, because a third hand-copied version of this path is
       exactly how the three copies drift apart.
       White ground and near-black ink are the colour law's built-in pair. No
       gradient. No product accent: this is the studio's asset, not one
       developer's, so it carries no developer colour at all. -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <g transform="translate(228 150) scale(7.6)">
    <path d="M2 16h5.5l3-8.5 5 17 3.5-10 2.5 1.5H30" fill="none" stroke="#0a0a0a" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="600" y="470" text-anchor="middle" fill="#0a0a0a"
        font-family="Anton, Impact, system-ui, sans-serif" font-size="96"
        letter-spacing="3">PULSE STUDIO</text>
  <text x="600" y="530" text-anchor="middle" fill="#5b5b5b"
        font-family="Epilogue, system-ui, sans-serif" font-size="34">
    book classes, ask anything, stay seen
  </text>
</svg>
