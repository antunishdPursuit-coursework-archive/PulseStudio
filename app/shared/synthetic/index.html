<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared Synthetic Studio</title>
  <meta name="description" content="One deterministic, normalized, fictional studio dataset for every Pulse Studio product.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../theme.css">
  <style>
    /* Shared infrastructure: black, white, and the sanctioned neutrals. */
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 14px 0; }
    .controls label { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); }
    .controls input, .controls select {
      font: inherit; color: var(--fg); background: var(--bg);
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    }
    .neutral-btn {
      background: var(--fg); color: var(--bg); border: 0; border-radius: 8px;
      padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .ghost-btn {
      background: transparent; color: var(--fg); border: 1px solid var(--line);
      border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer; margin-left: 8px;
    }
    .report { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 16px; }
    .metric { border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
    .metric strong { display: block; font-size: 1.5rem; }
    .metric span { color: var(--muted); font-size: 0.85rem; }
    #violations { color: var(--muted); font-size: 0.9rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header class="page-head">
    <a class="back" href="../../index.html">← Pulse Studio</a>
    <h1>Shared Synthetic Studio</h1>
  </header>
  <main>
    <p class="status" id="status" aria-live="polite">Configure and generate — every person is fictional, and nothing leaves this browser.</p>
    <section class="controls" aria-label="Generator configuration">
      <label>Seed <input id="seed" value="pulse-shared-0001"></label>
      <label>As-of date <input id="asOfDate" type="date"></label>
      <label>Members — blank lets the studio be its own size <input id="memberCount" type="number" min="1" max="2000" placeholder="organic (from seed)"></label>
      <label>History
        <select id="history">
          <option value="180">6 months</option>
          <option value="365">1 year</option>
          <option value="730">2 years</option>
          <option value="1825">5 years</option>
        </select>
      </label>
      <label>Mode
        <select id="mode">
          <option value="clean">clean</option>
          <option value="edge-cases">edge-cases</option>
          <option value="scale">scale</option>
        </select>
      </label>
    </section>
    <button class="neutral-btn" id="generate" type="button">Generate the studio</button>
    <button class="ghost-btn" id="download" type="button" hidden>Download JSON (stays on this device)</button>
    <button class="ghost-btn" id="download-csv" type="button" hidden>Download attendance CSV — drops straight into the re-engagement tool</button>
    <section class="report" id="report" aria-label="Generation report"></section>
    <p id="violations"></p>
    <p class="footer-note">
      Deterministic by construction: the same seed, date, and settings rebuild
      the identical studio. <a href="./tests.html">Run the proof suite</a>
    </p>
  </main>
  <script type="module" src="../theme-boot.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
