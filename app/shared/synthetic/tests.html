<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proof suite — Shared Synthetic Studio</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../theme.css">
  <style>
    /* Shared infrastructure carries no product colour: black, white, and
       the sanctioned neutrals only. Failures shout with weight. */
    #summary.all-good { border-left-color: var(--fg); }
    #summary.has-failures { border-left-color: var(--fg); font-weight: 800; text-decoration: underline; }
    #results { list-style: none; padding: 0; }
    #results li { border-top: 1px solid var(--line); padding: 8px 0; font-size: 0.92rem; }
    #results li.fail { font-weight: 800; text-decoration: underline; }
    #results li.stat { color: var(--muted); }
  </style>
</head>
<body>
  <header class="page-head">
    <a class="back" href="./index.html">← Synthetic studio</a>
    <h1>Proof suite</h1>
  </header>
  <main>
    <p class="status" id="summary" aria-live="polite">Running checks…</p>
    <p id="rule">Every configuration pins its own reference date, so verdicts
      never drift with the real clock. A failing check names what it expected
      and what it got.</p>
    <ul id="results"></ul>
  </main>
  <script type="module" src="../theme-boot.js"></script>
  <script type="module" src="./tests.js"></script>
</body>
</html>
