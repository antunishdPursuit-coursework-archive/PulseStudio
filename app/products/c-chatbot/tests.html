<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <title>Unit checks — Member Support</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../../shared/theme.css">
  <style>
    /* Lane-local verdict styling. No fifth color: failures shout with
       weight and the FAIL— text prefix instead of a hardcoded red. */
    #summary.all-good { border-left-color: var(--accent); }
    #summary.has-failures { border-left-color: var(--fg); font-weight: 800; text-decoration: underline; }
    #results { list-style: none; padding: 0; }
    #results li { border-top: 1px solid var(--line); padding: 8px 0; font-size: 0.92rem; }
    #results li.fail { font-weight: 800; text-decoration: underline; }
  </style>
</head>
<body class="product-c" data-no-session>
  <header class="page-head">
    <a class="back" href="./index.html">← Member support</a>
    <h1>Unit checks</h1>
  </header>
  <main>
    <p class="status" id="summary" aria-live="polite">Running checks…</p>
    <p id="rule">Every check passes its own "now", so verdicts never drift
      with the real clock. A failing check names what it expected and what
      it got.</p>
    <ul id="results"></ul>
  </main>
  <script type="module" src="../../shared/theme-boot.js"></script>
  <script type="module" src="./tests.js"></script>
</body>
</html>
