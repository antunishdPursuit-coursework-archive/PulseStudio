<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member Support — Pulse Studio</title>
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="product-c">
  <header class="page-head">
    <a class="home-brand" href="../../index.html" aria-label="Return to Pulse Studio home"><span class="home-arrow" aria-hidden="true">←</span><span class="brand-word">PULSE<span>STUDIO</span></span></a>
    <h1 class="role">Member support</h1>
  </header>
  <main>
    <section class="support-intro">
      <p class="eyebrow">Member support</p>
      <h2>How can we help?</h2>
      <p>Ask about the class schedule, class levels, or current studio policies.</p>
    </section>

    <section class="chat" aria-label="Conversation">
      <div class="messages" id="messages" aria-live="polite">
        <p class="message assistant">Hi! Ask me about Pulse Studio classes or policies.</p>
      </div>
      <form class="composer" id="chat-form">
        <label for="question">Your question</label>
        <div class="composer-row">
          <input id="question" name="question" autocomplete="off" placeholder="What yoga classes are available?" required>
          <button class="btn" type="submit">Send</button>
        </div>
      </form>
      <p class="status" id="status">Preparing the latest studio schedule and policies.</p>
    </section>
  </main>
  <script type="module" src="../../shared/theme-boot.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
