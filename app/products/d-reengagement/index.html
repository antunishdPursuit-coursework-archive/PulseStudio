<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member Re-engagement</title>
  <meta name="description" content="Staff tool: see which members have gone quiet and send them a personal note before they cancel.">
  <!-- Staff-only surface: never indexed. Cancellation-risk information is
       staff-only inference and must not surface in search results. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <!-- theme-color cannot read a CSS token; a reseller updates this one hex
       alongside the accent token (it is on the README rebrand checklist). -->
  <meta name="theme-color" content="#8b5cf6">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Member Re-engagement">
  <meta property="og:description" content="Staff tool: spot quiet members early and reach out with a personal note.">
  <meta name="author" content="Rensley">
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="product-d">
  <header class="page-head">
    <a class="home-brand" id="back-link" href="../../index.html" aria-label="Return to Pulse Studio home"><span class="home-arrow" aria-hidden="true">←</span><span class="brand-word">PULSE<span>STUDIO</span></span></a>
    <h1 class="role">Member Re-engagement</h1>
  </header>
  <main>
    <p class="status" id="status" aria-live="polite">Checking the member records…</p>
    <section class="import" aria-label="Choose which records to check">
      <label class="btn btn-outline" for="csv-input">Use your studio's attendance (CSV)</label>
      <input type="file" id="csv-input" accept=".csv,text/csv">
      <button class="btn-ghost" id="generate" type="button">See it at studio scale</button>
      <button class="btn-ghost" id="csv-reset" type="button" hidden>Back to the studio records</button>
      <p id="source" class="evidence" aria-live="polite"></p>
    </section>
    <p id="rule"></p>
    <section id="flagged" aria-label="Members who may need outreach"></section>
    <p class="footer-note" id="footer-note">
      Drafts only — staff review and send every message themselves; nothing on
      this page can send. <a href="./tests.html">Run the unit checks</a>
    </p>
  </main>
  <script type="module" src="../../shared/theme-boot.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
