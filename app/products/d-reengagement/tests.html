<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <title>Unit checks — Member Re-engagement</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../../shared/theme.css">
  <style>
    /* Lane-local verdict styling. No fifth color: the color law allows this
       product violet over var(--bg), so failures shout with weight and
       the FAIL— text prefix instead of a hardcoded red. */
    #summary.all-good { border-left-color: var(--accent); }
    #summary.has-failures { border-left-color: var(--fg); font-weight: 800; text-decoration: underline; }
    #results { list-style: none; padding: 0; }
    #results li { border-top: 1px solid var(--line); padding: 8px 0; font-size: 0.92rem; }
    #results li.fail { font-weight: 800; text-decoration: underline; }
  </style>
</head>
<body class="product-d" data-no-session>
  <header class="page-head">
    <a class="back" href="./index.html">← Member Re-engagement</a>
    <h1>Unit checks</h1>
    <span class="owner-badge">Rensley</span>
  </header>
  <main>
    <p class="status" id="summary" aria-live="polite">Running checks…</p>
    <p id="rule">Every check pins "today" to August 18, 2026, so verdicts never
      drift with the real clock. A failing check names what it expected and
      what it got.</p>
    <ul id="results"></ul>
  </main>
  <script type="module" src="../../shared/theme-boot.js"></script>
  <script type="module" src="./tests.js"></script>
</body>
</html>
