<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member Booking — Pulse Studio</title>
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="product-a">
  <header class="page-head">
    <a class="back" href="../../index.html">← Pulse Studio</a>
    <h1>Product A — Member Booking App</h1>
    <span class="owner-badge">Kerrian</span>
    <button class="theme-toggle" id="theme-toggle" type="button">Black / white</button>
  </header>
  <main>
    <p class="status" id="status">Loading the shared studio schedule.</p>
    <p class="error" id="error" hidden></p>

    <section id="auth" class="auth">
      <form id="signin-form">
        <label for="signin-id">Membership email or full name</label>
        <div class="signin-row">
          <input id="signin-id" name="identity" autocomplete="username" placeholder="Name or email on your membership">
          <button class="btn" type="submit">Sign in</button>
        </div>
      </form>
      <p class="who-line" id="who-line" hidden>
        Signed in as <strong id="who-name"></strong>
        <button class="btn ghost" type="button" id="signout">Sign out</button>
      </p>
    </section>

    <section id="confirmation" class="confirm" hidden></section>

    <section>
      <h2>Class schedule</h2>
      <p class="lede">The schedule is public. Choose a day, then reserve a spot. Other members' names stay hidden.</p>
      <nav class="days" id="days" aria-label="Schedule days"></nav>
      <h3 class="day-title" id="day-title"></h3>
      <div id="schedule"></div>
    </section>

    <section id="mine-wrap" hidden>
      <h2>Your reservations</h2>
      <div id="mine"></div>
    </section>
  </main>
  <script type="module" src="../../shared/theme-boot.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
