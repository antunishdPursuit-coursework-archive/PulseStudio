name: pages

# Browsers cannot run TypeScript and GitHub Pages does not build, so the
# site is compiled here. The gate always runs — a red gate never ships.
# The DEPLOY leg runs only when this repo's Pages is set to deploy from
# Actions (Settings -> Pages -> Source: GitHub Actions); otherwise the run
# states the skip and stays green, because "this repo has not enabled
# Actions deploys" is an environment fact, not a build failure. The
# workflow token cannot flip that switch itself — only a repo admin can.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # The gate runs before anything is published — a red gate never deploys.
      - run: npm run check
      - run: npm run build
      - name: Is this repo set to deploy Pages from Actions?
        id: pagesmode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo "none")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" != "workflow" ]; then
            {
              echo "### Build green — deploy skipped"
              echo "Pages source on this repo is \`$mode\`, not GitHub Actions."
              echo "A repo admin can enable deploys: Settings -> Pages -> Source: GitHub Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.pagesmode.outputs.mode == 'workflow'
        uses: actions/configure-pages@v5
      - if: steps.pagesmode.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - if: steps.pagesmode.outputs.mode == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4
