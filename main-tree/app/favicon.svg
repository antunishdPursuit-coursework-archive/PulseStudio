<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A pulse line. Follows the tab's theme the way the app follows the
       viewer's: dark ink on light chrome, light ink on dark. -->
  <style>
    .line { stroke: #0a0a0a; }
    @media (prefers-color-scheme: dark) { .line { stroke: #ffffff; } }
  </style>
  <path class="line" d="M2 16h5.5l3-8.5 5 17 3.5-10 2.5 1.5H30"
        fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
