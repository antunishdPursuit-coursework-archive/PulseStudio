<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse Studio</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #101515; color: #f5f1e8; }
    main { width: min(42rem, calc(100% - 3rem)); }
    p { color: #b9c2bd; line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2rem; }
    a { padding: .85rem 1.1rem; border: 1px solid #66756e; border-radius: .5rem; color: inherit; text-decoration: none; }
    a:hover, a:focus-visible { background: #f5f1e8; color: #101515; }
  </style>
</head>
<body>
  <main>
    <p>Pulse Studio</p>
    <h1>Membership Studio</h1>
    <p>Choose a view to explore the weekly class schedule and studio operations.</p>
    <nav aria-label="Pulse Studio products">
      <a href="member-dashboard.html">Member classes</a>
      <a href="staff-dashboard.html">Staff dashboard</a>
    </nav>
  </main>
</body>
</html>
